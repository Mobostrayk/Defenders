<!doctype html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>

    <!-- Подключение CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'users/css/users.css' %}">
    <link rel="stylesheet" href="{% static 'users/css/head.css' %}">

    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Верхняя панель навигации -->
    <header class="top-bar">
        <div class="nav-container">
            <div class="left-links">
                <a href="{% url 'index' %}" class="nav-link">Главная</a>
                <a href="{% url 'profile' %}" class="nav-link">Профиль</a>
            </div>

            <div class="title">
                <h1>Генератор привычек</h1>
            </div>

            <div class="right-links">
                <a href="{% url 'about' %}" class="nav-link faq-link">FAQ</a>
            </div>
        </div>
    </header>

    {% block content %}
    {% endblock %}

</body>
</html>
